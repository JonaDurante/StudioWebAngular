@if(card()){
  <div class="card stat-card p-3 col-2">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h5 class="text-muted mb-3">{{ card().title }}</h5>
      <h2 class="stat-value text-primary">{{ card().value | number }}</h2>
      @if(card().footerText) {
        <small class="text-success">
          <i class="bi bi-arrow-up-short"></i> {{ card().footerText }}
        </small>
      }
      @if(card().extraInfo){

        <small class="text-danger">
          {{ card().extraInfo }}
        </small>
      }
    </div>
    @if(card().icon) {
      <div class="icon-container">
        <i class="bi {{ card().icon }} stat-icon"></i>
      </div>
    }
  </div>
</div>
}
