<div class="card">
  @if (!!imgSrc()) {
    <div class="card-image d-flex flex-column align-items-center">
      <img [src]="imgSrc()" class="card-img" [alt]="imgAlt() ?? ''" />
      <a
        href="#"
        class="btn text-white mt-4"
        [class]="badgeClass"
        style="width: 8rem"
      >
        CLICK
      </a>
    </div>
  }
  <div class="card-body">
    <h5 class="card-title">{{ cardTitle() }}</h5>
    @if (!!badgeLevel()) {
      <span class="badge" [class]="badgeClass">{{ badgeLevel() }}</span>
    }
    <p class="card-text">{{ cardText() }}</p>
  </div>
  <div class="card-footer d-flex justify-content-between">
    <small class="text-muted"
      ><i class="bi bi-clock"></i> {{ duration() + ' min' }}</small
    >
    <small class="text-muted"
      ><i class="bi bi-person"></i> {{ instructor() }}</small
    >
  </div>
</div>
